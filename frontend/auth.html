<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Chat Manager</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <main class="main-container auth-page">
      <aside class="sidebar">
        <div class="logo-content">
          <div class="logo">
            <i class="fa-solid fa-comments"></i>
            <div class="logo-name">Chat Manager</div>
          </div>
        </div>
      </aside>

      <section class="content auth-content">
        <div class="auth-card">
          <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Log in or create an account to manage your conversations.</p>
          </div>

          <form id="auth-form" class="auth-form">
            <div class="input-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Enter your email" required />
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter your password" required />
            </div>

            <div class="auth-actions">
              <button type="button" class="create-conversation" onclick="signUpUser()">
                <i class="fa-solid fa-user-plus"></i>
                <span>Sign Up</span>
              </button>

              <button type="button" class="load-conversation" onclick="loginUser()">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Log In</span>
              </button>
            </div>

            <p id="auth-message" class="auth-message"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../backend/supabase.js"></script>
    <script src="../backend/auth.js"></script>
  </body>
</html>
