<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  </head>
  <body>
    <main class="main-container">
      <!--Sidebar-->
      <aside class="sidebar">
          <div class="logo-content">
            <div class="logo">
              <i class="fa-solid fa-comments"></i>
              <div class="logo-name">Chat Manager</div>
            </div>
            <ul class="navbar">
              <li>
                <a href="./index.html">
                  <i class="fa-solid fa-house"></i>
                  <span class="links-name">Home</span>
                </a>
              </li>
              <li>
                <a href="./screen2.html">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <span class="links-name">Search</span>
                </a>
              </li>
              <li>
                <a href="./screen3.html">
                  <i class="fa-solid fa-comments"></i>
                  <span class="links-name">Chat View</span>
                </a>
              </li>
            </ul>
          </div>
      </aside>

        <!--Main Content-->
        <section class="content">
          

          
          <div class="button-container">

          <h1>Home</h1>
      
          <button class="create-conversation" onclick="createConversation()">
          <i class="fa-solid fa-plus"></i>
          <span>New Conversation</span>
          </button>

          <button class="load-conversation" onclick="loadRecentConversation()">
          <i class="fa-solid fa-folder-open"></i>
          <span>Load Most Recent Conversation</span>
          </button>


          <div class="dropdown-conversation">
            <button class="dropdown-btn">Conversations</button>
            <div class="dropdown-content">
              <ul id="conversation-list">
              </ul>
            </div>
          </div>

          </div>


          <div>
            <h2 class="current-conversation">Current Conversation: None</h2>
          </div>
          
          <button class="button button1" onclick="startRecording()">
          <i class="fa-solid fa-microphone"></i>
          </button>
        
        <h3>Tap to Record</h3>
        <h2>Commonly Used Phrases</h2>
        

        <button class="add-phrase-btn" onclick="addNewPhrase()">Add New Phrase</button>
        
        <ul class="commonly-used-phrases" id="phraseList">
          <li class="commonly-used-phrase">
            <span class="phrase-text">Hello, how are you?</span>
            <button class="edit-btn" onclick="editShortcut(this)">✏️</button>
            <button class="delete-btn" onclick="deleteShortcut(this)">🗑️</button>
          </li>
        </ul>






        <div id="text-box">
            
        </div>
        </section>
        
        
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../backend/supabase.js"></script>
    <script src="voice-to-text.js"></script>
    <script src="..//backend/conversations.js"></script>
    <script src="./shortcut.js"></script>
</html>
